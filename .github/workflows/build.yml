name: Build LawRun Kernel (sm6250 - miatoll)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig to build'
        required: false
        default: 'LawRun_defconfig'
  push:
    branches:
      - master

env:
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'LawRun_defconfig' }}
  KERNEL_DIR: ${{ github.workspace }}
  OUT_DIR: out
  ARCH: arm64
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3
  PROTON_CLANG_REPO: https://github.com/kdrag0n/proton-clang

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git libssl-dev libelf-dev python3 python3-pip \
            zip unzip lld llvm

      - name: Set up real Python 2.7
        run: |
          curl -sSL -o /tmp/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
          bash /tmp/miniconda.sh -b -p $HOME/miniconda
          "$HOME/miniconda/bin/conda" create -y -n py27 -c conda-forge python=2.7
          sudo ln -sf "$HOME/miniconda/envs/py27/bin/python2.7" /usr/local/bin/python2

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.DEFCONFIG }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.DEFCONFIG }}-

      - name: Cache Proton Clang toolchain
        id: cache-proton
        uses: actions/cache@v4
        with:
          path: ~/proton
          key: proton-clang-${{ runner.os }}

      - name: Clone Proton Clang
        if: steps.cache-proton.outputs.cache-hit != 'true'
        run: git clone --depth=1 --single-branch ${{ env.PROTON_CLANG_REPO }} ~/proton

      - name: Set up KernelSU
        run: |
          if [ -f "./KernelSU" ] && [ ! -L "./KernelSU" ]; then
            echo "Repo's own KernelSU setup script found — running it."
            chmod +x ./KernelSU
            ./KernelSU
          else
            echo "No usable repo-local KernelSU script — using official non-GKI setup (locked to v0.9.5 for kernel 4.14)."
            rm -rf ./KernelSU
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          fi

      - name: Ensure drivers/kernelsu is actually built
        run: |
          if [ -d "drivers/kernelsu" ] && ! grep -q "kernelsu/" drivers/Makefile; then
            echo "drivers/Makefile is missing the kernelsu build line — adding it."
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

      - name: Fix ksu_input_hook in input.c
        run: |
          python3 -c "
          import re
          path = 'drivers/input/input.c'
          try:
              with open(path, 'r') as f:
                  content = f.read()
              if 'ksu_input_hook' in content:
                  print('Patching ksu_input_hook in ' + path)
                  content = re.sub(r'extern\s+bool\s+ksu_input_hook[^;]*;', '// extern bool ksu_input_hook;', content)
                  content = re.sub(r'ksu_input_hook\b(?!\s*\()', '1', content)
                  content = re.sub(r'\bksu_input_hook\b', 'ksu_handle_input_handle_event', content)
                  with open(path, 'w') as f:
                      f.write(content)
                  print('Successfully patched input.c')
          except Exception as e:
              print('Error patching input.c:', e)
          "

      - name: Verify defconfig exists
        run: |
          if [ ! -f "arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG }}" ]; then
            echo "::error::${{ env.DEFCONFIG }} not found in arch/${{ env.ARCH }}/configs/"
            exit 1
          fi

      - name: Generate .config and Enable KSU
        run: |
          mkdir -p ${{ env.OUT_DIR }}
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG }}
          echo "CONFIG_KSU=y" >> ${{ env.OUT_DIR }}/.config
          echo "CONFIG_KSU_DEFAULT_SU=y" >> ${{ env.OUT_DIR }}/.config
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} olddefconfig

      - name: Build kernel
        run: |
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          TC="$HOME/proton/bin"
          make -j$(nproc --all) O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} \
            CC="ccache $TC/clang" \
            LD="$TC/ld.lld" \
            AR="$TC/llvm-ar" \
            AS="$TC/llvm-as" \
            NM="$TC/llvm-nm" \
            OBJCOPY="$TC/llvm-objcopy" \
            OBJDUMP="$TC/llvm-objdump" \
            STRIP="$TC/llvm-strip" \
            CROSS_COMPILE="$TC/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC/arm-linux-gnueabi-" \
            Image.gz-dtb dtbo.img

      - name: Check build output
        run: |
          if [ ! -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb" ] || \
             [ ! -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img" ]; then
            echo "::error::Build output missing — compilation likely failed."
            exit 1
          fi

      # Raw images are uploaded first so a packaging problem never loses the build.
      - name: Upload raw kernel images
        uses: actions/upload-artifact@v4
        with:
          name: raw-boot-images
          path: |
            ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb
            ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img
          retention-days: 14

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 -q ${{ env.ANYKERNEL_REPO }} AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/LICENSE

          cat > AnyKernel3/anykernel.sh << 'AKEOF'
          ### AnyKernel3 Ramdisk Mod Script

          ## AnyKernel setup
          # global properties
          properties() { '
          kernel.string=LawRun Kernel for miatoll (sm6250)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=miatoll
          device.name2=curtana
          device.name3=excalibur
          device.name4=joyeuse
          device.name5=gram
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          ## boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables (both cases set for compatibility across AK3 versions)
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          block=$BLOCK;
          is_slot_device=$IS_SLOT_DEVICE;
          ramdisk_compression=$RAMDISK_COMPRESSION;
          patch_vbmeta_flag=$PATCH_VBMETA_FLAG;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          dump_boot;
          write_boot;

          # dtbo install
          flash_generic dtbo;
          AKEOF

          cp ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb AnyKernel3/
          cp ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img AnyKernel3/
          cd AnyKernel3
          ZIP_NAME="LawRun-miatoll-$(date '+%Y%m%d-%H%M').zip"
          zip -r9 "../$ZIP_NAME" . -x '*.git*' '*placeholder*'
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
          
