name: Build LawRun Kernel (sm6250 - miatoll)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig to build'
        required: false
        default: 'LawRun_defconfig'
  push:
    branches:
      - master

env:
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'LawRun_defconfig' }}
  KERNEL_DIR: ${{ github.workspace }}
  OUT_DIR: out
  ARCH: arm64
  ANYKERNEL_REPO: https://github.com/SonalSingh18/AnyKernel3
  PROTON_CLANG_REPO: https://github.com/kdrag0n/proton-clang

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git libssl-dev libelf-dev python3 python3-pip \
            zip unzip lld llvm

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.DEFCONFIG }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.DEFCONFIG }}-

      - name: Cache Proton Clang toolchain
        id: cache-proton
        uses: actions/cache@v4
        with:
          path: ~/proton
          key: proton-clang-${{ runner.os }}

      - name: Clone Proton Clang
        if: steps.cache-proton.outputs.cache-hit != 'true'
        run: git clone --depth=1 --single-branch ${{ env.PROTON_CLANG_REPO }} ~/proton

      - name: Export toolchain path
        run: echo "$HOME/proton/bin" >> $GITHUB_PATH

      - name: Verify defconfig exists
        run: |
          if [ ! -f "arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG }}" ]; then
            echo "::error::${{ env.DEFCONFIG }} not found in arch/${{ env.ARCH }}/configs/"
            exit 1
          fi

      - name: Generate .config
        run: |
          mkdir -p ${{ env.OUT_DIR }}
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG }}

      - name: Build kernel
        run: |
          export PATH="$HOME/proton/bin:$PATH"
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          make -j$(nproc --all) O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb dtbo.img

      - name: Check build output
        run: |
          if [ ! -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb" ] || \
             [ ! -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img" ]; then
            echo "::error::Build output missing — compilation likely failed."
            exit 1
          fi

      - name: Package with AnyKernel3
        run: |
          git clone -q ${{ env.ANYKERNEL_REPO }} AnyKernel3
          cp ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb AnyKernel3/
          cp ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img AnyKernel3/
          cd AnyKernel3
          ZIP_NAME="LawRun-miatoll-$(date '+%Y%m%d-%H%M').zip"
          zip -r9 "../$ZIP_NAME" * -x '*.git*' README.md '*placeholder*'
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14

      - name: Upload raw kernel images
        uses: actions/upload-artifact@v4
        with:
          name: raw-boot-images
          path: |
            ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb
            ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img
          retention-days: 14
