name: Build LawRun Kernel (sm6250 - miatoll)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig to build'
        required: false
        default: 'LawRun_defconfig'
  push:
    branches:
      - master

env:
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'LawRun_defconfig' }}
  KERNEL_DIR: ${{ github.workspace }}
  OUT_DIR: out
  ARCH: arm64
  ANYKERNEL_REPO: https://github.com/SonalSingh18/AnyKernel3
  PROTON_CLANG_REPO: https://github.com/kdrag0n/proton-clang

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git libssl-dev libelf-dev python3 python3-pip \
            zip unzip lld llvm

      - name: Set up real Python 2.7
        run: |
          curl -sSL -o /tmp/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
          bash /tmp/miniconda.sh -b -p $HOME/miniconda
          "$HOME/miniconda/bin/conda" create -y -n py27 -c conda-forge python=2.7
          sudo ln -sf "$HOME/miniconda/envs/py27/bin/python2.7" /usr/local/bin/python2

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.DEFCONFIG }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.DEFCONFIG }}-

      - name: Cache Proton Clang toolchain
        id: cache-proton
        uses: actions/cache@v4
        with:
          path: ~/proton
          key: proton-clang-${{ runner.os }}

      - name: Clone Proton Clang
        if: steps.cache-proton.outputs.cache-hit != 'true'
        run: git clone --depth=1 --single-branch ${{ env.PROTON_CLANG_REPO }} ~/proton

      - name: Set up KernelSU
        run: |
          if [ -f "./KernelSU" ] && [ ! -L "./KernelSU" ]; then
            echo "Repo's own KernelSU setup script found — running it."
            chmod +x ./KernelSU
            ./KernelSU
          else
            echo "No usable repo-local KernelSU script — using official non-GKI setup (locked to v0.9.5 for kernel 4.14)."
            rm -rf ./KernelSU
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          fi

      - name: Ensure drivers/kernelsu is actually built
        run: |
          if [ -d "drivers/kernelsu" ] && ! grep -q "kernelsu/" drivers/Makefile; then
            echo "drivers/Makefile is missing the kernelsu build line — adding it."
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

      - name: Diagnose KernelSU input hook symbol
        run: |
          echo "--- drivers/kernelsu contents ---"
          ls -la drivers/kernelsu 2>&1 || echo "drivers/kernelsu MISSING"
          echo "--- drivers/Makefile kernelsu lines ---"
          grep -n "kernelsu" drivers/Makefile 2>&1 || echo "no kernelsu reference in drivers/Makefile"
          echo "--- searching for ksu_input_hook definition ---"
          grep -rn "ksu_input_hook" drivers/kernelsu 2>&1 || echo "ksu_input_hook NOT FOUND anywhere in drivers/kernelsu"
          echo "--- searching for ksu_handle_input_handle_event definition ---"
          grep -rn "ksu_handle_input_handle_event" drivers/kernelsu 2>&1 || echo "ksu_handle_input_handle_event NOT FOUND anywhere in drivers/kernelsu"

      - name: Verify defconfig exists
        run: |
          if [ ! -f "arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG }}" ]; then
            echo "::error::${{ env.DEFCONFIG }} not found in arch/${{ env.ARCH }}/configs/"
            exit 1
          fi

      - name: Generate .config
        run: |
          mkdir -p ${{ env.OUT_DIR }}
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG }}

      - name: Diagnose KSU/kprobe config
        run: |
          grep -E "CONFIG_KSU|CONFIG_KPROBES" ${{ env.OUT_DIR }}/.config 2>&1 || echo "no CONFIG_KSU/CONFIG_KPROBES lines found in .config"

      - name: Diagnose drivers/Makefile context + standalone kernelsu build
        run: |
          echo "--- context around our appended obj-y line ---"
          LINE=$(grep -n "^obj-y += kernelsu/$" drivers/Makefile | tail -1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            START=$((LINE>8 ? LINE-8 : 1))
            sed -n "${START},$((LINE+3))p" drivers/Makefile
          else
            echo "could not locate the appended line"
          fi
          echo "--- attempting to build ONLY drivers/kernelsu ---"
          TC="$HOME/proton/bin"
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} \
            CC="$TC/clang" LD="$TC/ld.lld" AR="$TC/llvm-ar" AS="$TC/llvm-as" \
            NM="$TC/llvm-nm" OBJCOPY="$TC/llvm-objcopy" OBJDUMP="$TC/llvm-objdump" \
            STRIP="$TC/llvm-strip" CROSS_COMPILE="$TC/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC/arm-linux-gnueabi-" \
            drivers/kernelsu 2>&1 | tail -60
          echo "--- resulting object files ---"
          find ${{ env.OUT_DIR }}/drivers/kernelsu -name "*.o" 2>&1 || echo "out/drivers/kernelsu has no .o files / doesn't exist"

      - name: Build kernel
        run: |
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          TC="$HOME/proton/bin"
          make -j$(nproc --all) O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} \
            CC="ccache $TC/clang" \
            LD="$TC/ld.lld" \
            AR="$TC/llvm-ar" \
            AS="$TC/llvm-as" \
            NM="$TC/llvm-nm" \
            OBJCOPY="$TC/llvm-objcopy" \
            OBJDUMP="$TC/llvm-objdump" \
            STRIP="$TC/llvm-strip" \
            CROSS_COMPILE="$TC/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC/arm-linux-gnueabi-" \
            Image.gz-dtb dtbo.img

      - name: Check build output
        run: |
          if [ ! -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb" ] || \
             [ ! -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img" ]; then
            echo "::error::Build output missing — compilation likely failed."
            exit 1
          fi

      - name: Package with AnyKernel3
        run: |
          git clone -q ${{ env.ANYKERNEL_REPO }} AnyKernel3
          cp ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb AnyKernel3/
          cp ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img AnyKernel3/
          cd AnyKernel3
          ZIP_NAME="LawRun-miatoll-$(date '+%Y%m%d-%H%M').zip"
          zip -r9 "../$ZIP_NAME" * -x '*.git*' README.md '*placeholder*'
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14

      - name: Upload raw kernel images
        uses: actions/upload-artifact@v4
        with:
          name: raw-boot-images
          path: |
            ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb
            ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img
          retention-days: 14
