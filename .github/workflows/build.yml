name: CI - LawRun Kernel sm6250 (KSU Fixed)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils git make bc bison openssl curl zip kmod cpio flex \
            libelf-dev libssl-dev libtfm-dev libc6-dev device-tree-compiler \
            ca-certificates python3 xz-utils aria2 build-essential ccache \
            pigz parallel jq

      - name: Download Toolchains (Proton Clang & GCC)
        run: |
          git clone --depth=1 [https://github.com/kdrag0n/proton-clang.git](https://github.com/kdrag0n/proton-clang.git) /home/runner/clang
          git clone --depth=1 -b android12-release [https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9](https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9) /home/runner/gcc-64
          git clone --depth=1 -b android12-release [https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9](https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9) /home/runner/gcc-32

      - name: Clone Your Kernel Source
        run: |
          git clone --depth=1 -b master [https://github.com/aafiqbinkhayer-Toshiro/LawRun_xiaomi_sm6250_-hackX](https://github.com/aafiqbinkhayer-Toshiro/LawRun_xiaomi_sm6250_-hackX) /home/runner/kernel

      - name: Setup KernelSU (Official Integration)
        run: |
          cd /home/runner/kernel
          # পুরানো কোনো ফোল্ডার থাকলে রিমুভ করা
          rm -rf drivers/kernelsu KernelSU
          
          # অফিসিয়াল সেটআপ স্ক্রিপ্ট দিয়ে v0.9.3 ইন্টিগ্রেট করা
          curl -LSs "[https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh](https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh)" | bash -s v0.9.3
          
          # ভেরিফিকেশন
          ls -la drivers/kernelsu

      - name: Compile the Kernel
        run: |
          cd /home/runner/kernel
          export PATH="/home/runner/clang/bin:$PATH"
          export CROSS_COMPILE="/home/runner/gcc-64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="/home/runner/gcc-32/bin/arm-linux-androideabi-"
          
          # Defconfig জেনারেট করা
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- LawRun_defconfig
          
          # কনফিগে KSU সক্রিয় করা
          ./scripts/config --file out/.config -e KSU
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
          
          # কার্নেল কম্পাইলেশন শুরু
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- all

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 [https://github.com/osm0sis/AnyKernel3.git](https://github.com/osm0sis/AnyKernel3.git) /home/runner/AnyKernel3
          
          # কম্পাইল করা Image কপি করা
          find /home/runner/kernel/out/arch/arm64/boot/ -maxdepth 1 -name "Image*" -exec cp {} /home/runner/AnyKernel3/ \;
          
          # dtbo বা dtb থাকলে সেগুলোও কপি করে নেওয়া (sm6250 এর জন্য দরকার হতে পারে)
          find /home/runner/kernel/out/arch/arm64/boot/ -maxdepth 1 -name "dtbo.img" -exec cp {} /home/runner/AnyKernel3/ \; || true
          
          cd /home/runner/AnyKernel3
          
          # Miatoll / sm6250 ডিভাইসের নাম সেট করা
          sed -i 's/device.name1=.*/device.name1=joyeuse/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=miatoll/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=excalibur/g' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=curtana/g' anykernel.sh
          sed -i 's/device.name5=.*/device.name5=gram/g' anykernel.sh
          
          zip -r9 /home/runner/LawRun-sm6250-KSU-v0.9.3.zip * -x .git README.md *placeholder

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: LawRun-sm6250-KSU-Zip
          path: /home/runner/LawRun-sm6250-KSU-v0.9.3.zip
