name: CI - LawRun Kernel sm6250 (KSU Fixed)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils git make bc bison openssl curl zip kmod cpio flex \
            libelf-dev libssl-dev libtfm-dev libc6-dev device-tree-compiler \
            ca-certificates python3 python-is-python3 xz-utils aria2 build-essential ccache \
            pigz parallel jq

      - name: Download Toolchains (Proton Clang & GCC)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git /home/runner/clang
          git clone --depth=1 -b android12-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 /home/runner/gcc-64
          git clone --depth=1 -b android12-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 /home/runner/gcc-32

      - name: Clone Your Kernel Source
        run: |
          git clone --depth=1 -b master https://github.com/aafiqbinkhayer-Toshiro/LawRun_xiaomi_sm6250_-hackX /home/runner/kernel

      - name: Setup KernelSU
        run: |
          cd /home/runner/kernel
          rm -rf drivers/kernelsu KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.3

      - name: Compile the Kernel
        run: |
          cd /home/runner/kernel
          export PATH="/home/runner/clang/bin:$PATH"
          export CROSS_COMPILE="/home/runner/gcc-64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="/home/runner/gcc-32/bin/arm-linux-androideabi-"
          
          # Defconfig তৈরি
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- LawRun_defconfig
          
          # KSU এবং প্রয়োজনীয় ডিপেন্ডেন্সি এনাবল
          ./scripts/config --file out/.config -e KSU
          ./scripts/config --file out/.config -e OVERLAY_FS
          
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
          
          # ফুল কার্নেল কম্পাইলেশন
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=/home/runner/gcc-64/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=/home/runner/gcc-32/bin/arm-linux-androideabi- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            all

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /home/runner/AnyKernel3
          
          # Image.gz / Image.gz-dtb এবং dtbo কপি (Nested path সহ খুঁজবে)
          find /home/runner/kernel/out/arch/arm64/boot/ -name "Image*" -exec cp {} /home/runner/AnyKernel3/ \;
          find /home/runner/kernel/out/arch/arm64/boot/ -name "dtbo.img" -exec cp {} /home/runner/AnyKernel3/ \; || true
          find /home/runner/kernel/out/arch/arm64/boot/ -name "*.dtb" -exec cp {} /home/runner/AnyKernel3/dtb \; || true
          
          cd /home/runner/AnyKernel3
          sed -i 's/device.name1=.*/device.name1=joyeuse/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=miatoll/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=excalibur/g' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=curtana/g' anykernel.sh
          sed -i 's/device.name5=.*/device.name5=gram/g' anykernel.sh
          
          zip -r9 /home/runner/LawRun-sm6250-KSU-v0.9.3.zip * -x .git README.md *placeholder

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: LawRun-sm6250-KSU-Zip
          path: /home/runner/LawRun-sm6250-KSU-v0.9.3.zip
